name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    name: vet + test (macOS)
    runs-on: tenki-macos-26-small
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: go build
        run: go build ./...

  test-linux:
    name: vet + test (Linux)
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      # Linux tests run without -race to avoid CGO requirements for some
      # macOS-specific code paths that are stubbed but still compiled.
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...
